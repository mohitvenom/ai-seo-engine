<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect width="100" height="100" rx="22" fill="url(#shine)"/>

  <!-- Magnifier circle -->
  <circle cx="44" cy="43" r="18" fill="none" stroke="white" stroke-width="7" opacity="0.95"/>

  <!-- Magnifier handle -->
  <line x1="57" y1="56" x2="70" y2="70" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.95"/>

  <!-- Signal bars inside magnifier (SEO bars) -->
  <rect x="36" y="50" width="4" height="6" rx="1.5" fill="white" opacity="0.9"/>
  <rect x="42" y="46" width="4" height="10" rx="1.5" fill="white" opacity="0.9"/>
  <rect x="48" y="42" width="4" height="14" rx="1.5" fill="white" opacity="0.9"/>

  <!-- AI spark top-right -->
  <circle cx="76" cy="24" r="8" fill="white" opacity="0.15"/>
  <text x="76" y="28" text-anchor="middle" font-size="10" font-weight="800" fill="white" font-family="Inter, sans-serif" opacity="0.95">AI</text>
</svg>